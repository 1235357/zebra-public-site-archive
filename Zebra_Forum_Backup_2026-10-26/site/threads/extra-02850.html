*{box-sizing:border-box;margin:0;padding:0;font-family:'Zebra Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
body{background:#ffffff;color:#000}
nav{display:flex;justify-content:space-between;align-items:center;background:#303030;padding:24px 96px}
.nav-logo{display:flex;align-items:center}
.nav-logo svg{height:32px;width:auto}
.nav-search{position:relative;display:flex;align-items:center}
.nav-search input{height:40px;font-size:14px;padding:8px 48px 8px 24px;border:none;border-radius:24px;background:#ffffff;color:#303030;width:260px;outline:none}
.nav-search input::placeholder{color:#757575}
.nav-search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);height:32px;width:32px;border:none;border-radius:50%;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.nav-search button svg{width:16px;height:16px;fill:#303030}
.error-section{text-align:center;padding:48px 24px 80px}
.error-section h2{font-weight:700;font-stretch:condensed;font-size:42px;line-height:44px;color:#000;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:32px}
.error-section img{width:100%;max-width:480px;margin:0 auto 32px;display:block;border-radius:12px}
.error-section .error-body{color:#000;font-size:16px;line-height:1.6;margin-bottom:6px}
.error-section .error-contact{color:#000;font-size:16px;line-height:1.6;margin-bottom:32px}
.error-section .error-contact a{color:#1E22AA;text-decoration:none}
.error-section .error-contact a:hover{color:#1119AA;text-decoration:underline}
.btn-home{display:inline-block;border-radius:24px;border:1px solid #757575;background:#000;padding:8px 24px;color:#fff;text-decoration:none;font-weight:500;font-size:14px;line-height:22px}
.btn-home:hover{background-color:#A8F931;border-color:#A8F931;color:#000}
.sf-hidden{display:none!important}
@media(max-width:768px){nav{padding:16px 24px}.nav-search input{width:180px}.error-section h2{font-size:2rem}}
